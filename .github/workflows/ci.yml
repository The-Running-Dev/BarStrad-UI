# ====================================================================
# CONTINUOUS INTEGRATION (CI) WORKFLOW
# ====================================================================
#
# Purpose: Automated code validation workflow that runs on pull requests
#          and feature branch pushes to ensure code quality and prevent
#          broken code from being merged into the main branch.
#
# This workflow is responsible for:
# - Validating TypeScript compilation and build process
# - Running dry-run builds to catch issues early
# - Providing fast feedback to developers during development
# - Ensuring code quality before merge to main branch
# - Preventing resource waste with non-publishing builds
#
# ====================================================================
# WORKFLOW STRATEGY
# ====================================================================
#
# CI vs Release Workflow Separation:
# - CI WORKFLOW (this file): Validates changes, dry-run builds, no artifacts
# - RELEASE WORKFLOW: Production builds, publishes artifacts, creates releases
#
# Benefits of this approach:
# - Fast feedback loop for developers
# - Resource efficiency (no unnecessary publishing)
# - Clear separation of concerns
# - Reduced risk of accidental production deployments
#
# ====================================================================
# TRIGGERS & CONDITIONS
# ====================================================================
#
# This workflow runs on:
# 1. PULL REQUESTS: All PR events (opened, synchronized, etc.)
# 2. FEATURE BRANCH PUSHES: Any branch except main
# 3. MANUAL TRIGGER: Manual execution via workflow_dispatch
#
# Path Exclusions (workflow will NOT run if only these paths change):
# - documentation/** : Documentation-only changes don't need validation
# - .github/**       : Workflow changes don't need code validation
#
# Branch Exclusions:
# - main branch pushes are handled by the Release workflow
#
# ====================================================================
# EXECUTION CONDITIONS
# ====================================================================
#
# The job runs when ANY of these conditions are true:
# - Pull request event (any type)
# - Manual workflow dispatch
# - Push to any branch except main
#
# IMPORTANT: Dual Execution Behavior
# When you push to a feature branch that has an open PR, this workflow
# will run TWICE - once for the push event and once for the PR event.
# This is intentional and provides:
# - Push event: Immediate feedback for developers
# - PR event: Validation context for code reviewers
#
# This ensures:
# - All pull requests are validated before merge
# - Feature branches get immediate validation on push
# - Main branch changes trigger Release workflow instead
#
# ====================================================================
# BUILD ENVIRONMENT
# ====================================================================
#
# Runner: GitHub-hosted Ubuntu Latest
# Container: Custom build agent with pre-installed tools:
# - Node.js runtime and package managers
# - TypeScript compiler and build tools
# - Docker for containerized builds
# - GitVersion for version calculation
# - Custom build scripts optimized for this project
#
# ====================================================================
# SECURITY & PERMISSIONS
# ====================================================================
#
# Required Permissions:
# - packages:write : Limited write access for potential registry operations
#                   (though this workflow doesn't publish, maintained for consistency)
#
# Required Secrets:
# - REGISTRY_TOKEN            : GitHub token (for potential future registry operations)
# - NOTIFICATIONS_WEBHOOK_URL : Webhook for build status notifications
# - DISCORD_BOT_TOKEN         : Discord bot token (for build environment consistency)
# - DISCORD_WEBHOOK_URL       : Discord webhook for CI notifications
#
# ====================================================================

name: CI

# ====================================================================
# WORKFLOW TRIGGERS
# ====================================================================
on:
  # Manual trigger for testing or debugging CI process
  # Usage: Go to Actions tab > CI workflow > Run workflow
  workflow_dispatch:
  
  # Trigger on all pull request events (opened, synchronized, reopened, etc.)
  pull_request:
    # Skip CI if only documentation or workflow files changed
    paths-ignore:
      - 'documentation/**'  # Documentation changes don't need code validation
      - '.github/**'        # Workflow changes don't need code validation

# ====================================================================
# SECURITY PERMISSIONS
# ====================================================================
# Minimal required permissions following principle of least privilege
permissions:
  packages: write  # Maintained for consistency with Release workflow

# ====================================================================
# JOBS CONFIGURATION
# ====================================================================
jobs:
  Build:
    # Use GitHub-hosted Ubuntu runner for consistent, clean environment
    runs-on: ubuntu-latest
    
    # Custom build container with pre-installed development tools
    # Same container as Release workflow for consistency
    container:
      image: ghcr.io/the-running-dev/build-agent:latest

    # ================================================================
    # EXECUTION CONDITIONS
    # ================================================================
    # Explicit condition check to ensure workflow runs only when intended
    # This provides clear documentation of when the job executes
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')

    steps:
      - uses: fkirc/skip-duplicate-actions@v5
        with:
          cancel_others: true
          concurrent_skipping: same_content_newer
          skip_after_successful_duplicate: true

      # ================================================================
      # STEP 1: REPOSITORY CHECKOUT
      # ================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch complete git history for accurate build context
          # Required for GitVersion and proper build environment setup
          # Ensures consistent behavior between CI and Release workflows
          fetch-depth: 0

      # ================================================================
      # STEP 2: VALIDATION BUILD
      # ================================================================
      - name: Build
        # Dry-run build that validates code without publishing artifacts
        # This provides fast feedback while conserving resources
        # --dry-run flag ensures no artifacts are published or deployed
        run: node-in-docker-build --dry-run true
        env:
          # ============================================================
          # ENVIRONMENT VARIABLES & SECRETS
          # ============================================================
          
          # GitHub authentication token
          # Used for: Registry authentication (if needed), API access
          RegistryToken: ${{ secrets.REGISTRY_TOKEN }}
          
          # Webhook URL for CI build notifications
          # Used for: Sending status updates to external monitoring systems
          NotificationsWebHookUrl: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}

          # Discord webhook URL for order notifications
          DiscordWebhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}

# ====================================================================
# VALIDATION PROCESS
# ====================================================================
#
# The dry-run build performs the following validations:
# 1. TypeScript compilation check
# 2. Dependency resolution and installation
# 3. Docker image build validation (without pushing)
# 4. Code quality and syntax verification
# 5. Build script execution verification
#
# Success Criteria:
# - All TypeScript files compile without errors
# - All dependencies resolve correctly
# - Docker build completes successfully
# - Build scripts execute without failures
# - No critical errors or warnings
#
# ====================================================================
# DEVELOPMENT WORKFLOW INTEGRATION
# ====================================================================
#
# This CI workflow integrates with the development process:
#
# Feature Development Flow:
# 1. Developer creates feature branch → CI validates on push
# 2. Developer opens pull request → CI validates PR changes (runs again)
# 3. Code review process with CI validation results
# 4. PR merge to main → Release workflow takes over
#
# Note: Steps 1 and 2 will result in CI running twice if you push to a 
# branch with an open PR. This provides both immediate feedback and PR context.
#
# Benefits for Developers:
# - Fast feedback on code changes (2-3 minutes typical)
# - Early detection of build issues
# - Consistent validation environment
# - Reduced risk of breaking main branch
# - Both push-time and PR-time validation
#
# ====================================================================
# TROUBLESHOOTING GUIDE
# ====================================================================
#
# Common Issues and Solutions:
#
# 1. TypeScript Compilation Errors:
#    - Check syntax errors in modified files
#    - Verify import statements and dependencies
#    - Ensure TypeScript configuration is correct
#
# 2. Docker Build Failures:
#    - Review Dockerfile for syntax errors
#    - Check base image availability
#    - Verify build context and file paths
#
# 3. Dependency Issues:
#    - Check package.json for correct dependencies
#    - Verify npm/yarn lockfile consistency
#    - Review dependency version conflicts
#
# 4. Container Environment Issues:
#    - Verify build agent container availability
#    - Check container registry access permissions
#    - Review container resource limits
#
# 5. Path Filter Issues:
#    - Review paths-ignore configuration
#    - Check if changes affect ignored paths only
#    - Verify branch and path conditions
#
# ====================================================================
# PERFORMANCE OPTIMIZATION
# ====================================================================
#
# This workflow is optimized for:
# - Fast execution (dry-run builds)
# - Resource efficiency (no artifact publishing)
# - Parallel execution capability
# - Minimal resource consumption
#
# Performance Monitoring:
# - Typical run time: 2-3 minutes
# - Resource usage: Low (validation only)
# - Success rate: Monitor for build failures
# - Queue time: Monitor for runner availability
#
# ====================================================================
# MAINTENANCE & MONITORING
# ====================================================================
#
# Regular Maintenance Tasks:
# - Update GitHub Actions versions (actions/checkout@v4)
# - Monitor build agent container updates
# - Review and optimize build scripts
# - Update path exclusion patterns as needed
# - Review success/failure rates and optimize accordingly
#
# Monitoring Points:
# - Build success rate per branch/PR
# - Average build duration trends
# - Error patterns and common failures
# - Resource usage and efficiency metrics
# - Developer feedback on CI speed and reliability
#
# ====================================================================