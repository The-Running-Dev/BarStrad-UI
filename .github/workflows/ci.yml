# ====================================================================
# CONTINUOUS INTEGRATION (CI) WORKFLOW
# ====================================================================
#
# Purpose: Automated code validation workflow that runs on pull requests
#          and feature branch pushes to ensure code quality and prevent
#          broken code from being merged into the main branch.
#
# This workflow is responsible for:
# - Validating TypeScript compilation and build process
# - Running dry-run builds to catch issues early
# - Providing fast feedback to developers during development
# - Ensuring code quality before merge to main branch
# - Preventing resource waste with non-publishing builds
#
# ====================================================================
# WORKFLOW STRATEGY
# ====================================================================
#
# CI vs Release Workflow Separation:
# - CI WORKFLOW (this file): Validates changes, dry-run builds, no artifacts
# - RELEASE WORKFLOW: Production builds, publishes artifacts, creates releases
#
# Benefits of this approach:
# - Fast feedback loop for developers
# - Resource efficiency (no unnecessary publishing)
# - Clear separation of concerns
# - Reduced risk of accidental production deployments
#
# ====================================================================
# TRIGGERS & CONDITIONS
# ====================================================================
#
# This workflow runs on:
# 1. PULL REQUESTS: All PR events (opened, synchronized, etc.)
# 2. FEATURE BRANCH PUSHES: Any branch except main
# 3. MANUAL TRIGGER: Manual execution via workflow_dispatch
#
# Path Exclusions (workflow will NOT run if only these paths change):
# - documentation/** : Documentation-only changes don't need validation
# - .github/**       : Workflow changes don't need code validation
#
# Branch Exclusions:
# - main branch pushes are handled by the Release workflow
#
# ====================================================================
# EXECUTION CONDITIONS
# ====================================================================
#
# The job runs when ANY of these conditions are true:
# - Pull request event (any type)
# - Manual workflow dispatch
# - Push to any branch except main
#
# This ensures:
# - All pull requests are validated before merge
# - Feature branches are validated on push
# - Main branch changes trigger Release workflow instead
#
# ====================================================================
# BUILD ENVIRONMENT
# ====================================================================
#
# Runner: GitHub-hosted Ubuntu Latest
# Container: Custom build agent with pre-installed tools:
# - Node.js runtime and pnpm package manager
# - Angular CLI and TypeScript compiler
# - Docker for containerized builds
# - GitVersion for version calculation
# - Custom build scripts (node-in-docker-build) optimized for this project
#
# Project Structure:
# - Angular 19.1.0 application with TypeScript
# - pnpm package manager (configured in package.json)
# - ESLint for code quality validation
# - Docker containerization with nginx serving
# - PowerShell build script (build.ps1) for local development
#
# ====================================================================
# SECURITY & PERMISSIONS
# ====================================================================
#
# Required Permissions:
# - packages:write : Limited write access for potential registry operations
#                   (though this workflow doesn't publish, maintained for consistency)
#
# Required Secrets:
# - REGISTRY_TOKEN            : GitHub token (for potential future registry operations)
# - NOTIFICATIONS_WEBHOOK_URL : Webhook for build status notifications
# - DISCORD_WEBHOOK_URL       : Discord webhook for CI notifications
#
# Note: The custom build container (ghcr.io/the-running-dev/docker-build-agent:latest)
# handles the actual Angular build process through the node-in-docker-build command.
# This ensures consistent builds between CI and Release workflows.
#
# ====================================================================

name: CI

# ====================================================================
# WORKFLOW TRIGGERS
# ====================================================================
on:
  # Manual trigger for testing or debugging CI process
  # Usage: Go to Actions tab > CI workflow > Run workflow
  workflow_dispatch:
  
  # Trigger on all pull request events (opened, synchronized, reopened, etc.)
  pull_request:
    # Skip CI if only documentation or workflow files changed
    paths-ignore:
      - 'documentation/**'  # Documentation changes don't need code validation
      - '.github/**'        # Workflow changes don't need code validation
  
  # Trigger on pushes to any branch except main
  push:
    branches:
      - '**'      # Match all branches
      - '!main'   # Exclude main branch (handled by Release workflow)
    # Skip CI if only documentation or workflow files changed
    paths-ignore:
      - 'documentation/**'  # Documentation changes don't need code validation
      - '.github/**'        # Workflow changes don't need code validation

# ====================================================================
# SECURITY PERMISSIONS
# ====================================================================
# Minimal required permissions following principle of least privilege
permissions:
  packages: write  # Maintained for consistency with Release workflow

# ====================================================================
# JOBS CONFIGURATION
# ====================================================================
jobs:
  Build:
    # Use GitHub-hosted Ubuntu runner for consistent, clean environment
    runs-on: ubuntu-latest
    
    # Custom build container with pre-installed development tools
    # Same container as Release workflow for consistency
    container:
      image: ghcr.io/the-running-dev/build-agent:latest

    # ================================================================
    # EXECUTION CONDITIONS
    # ================================================================
    # Explicit condition check to ensure workflow runs only when intended
    # This provides clear documentation of when the job executes
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')

    steps:
      # ================================================================
      # STEP 1: REPOSITORY CHECKOUT
      # ================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch complete git history for accurate build context
          # Required for GitVersion and proper build environment setup
          # Ensures consistent behavior between CI and Release workflows
          fetch-depth: 0

      # ================================================================
      # STEP 2: VALIDATION BUILD
      # ================================================================
      - name: Build
        # Dry-run build that validates code without publishing artifacts
        # This provides fast feedback while conserving resources
        # --dry-run flag ensures no artifacts are published or deployed
        run: node-in-docker-build --dry-run true
        env:
          # ============================================================
          # ENVIRONMENT VARIABLES & SECRETS
          # ============================================================
          
          # GitHub authentication token
          # Used for: Registry authentication (if needed), API access
          RegistryToken: ${{ secrets.REGISTRY_TOKEN }}
          
          # Webhook URL for CI build notifications
          # Used for: Sending status updates to external monitoring systems
          NotificationsWebHookUrl: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}
          
          # Discord webhook URL for CI notifications
          # Used for: Sending CI status updates to Discord channels
          DiscordWebhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}

# ====================================================================
# VALIDATION PROCESS
# ====================================================================
#
# The dry-run build performs the following validations:
# 1. Angular project dependency installation (pnpm-based)
# 2. TypeScript compilation and Angular CLI build process
# 3. ESLint code quality and style validation
# 4. Docker image build validation (nginx + Angular artifacts)
# 5. Build script execution verification (node-in-docker-build)
#
# Success Criteria:
# - All Angular dependencies resolve correctly via pnpm
# - TypeScript files compile without errors
# - ESLint passes with project configuration
# - Angular production build completes successfully
# - Docker build creates valid nginx-served container
# - No critical errors or warnings in build output
#
# Build Artifacts Validated:
# - artifacts/browser/ directory with compiled Angular app
# - Docker image with nginx serving static files
# - Production-optimized JavaScript and CSS bundles
#
# ====================================================================
# DEVELOPMENT WORKFLOW INTEGRATION
# ====================================================================
#
# This CI workflow integrates with the development process:
#
# Feature Development Flow:
# 1. Developer creates feature branch → CI validates on push
# 2. Developer opens pull request → CI validates PR changes
# 3. Code review process with CI validation results
# 4. PR merge to main → Release workflow takes over
#
# Benefits for Developers:
# - Fast feedback on code changes (3-5 minutes typical for Angular builds)
# - Early detection of TypeScript and Angular build issues
# - Consistent validation environment matching production
# - Reduced risk of breaking main branch with build failures
#
# ====================================================================
# TROUBLESHOOTING GUIDE
# ====================================================================
#
# Common Issues and Solutions:
#
# 1. Angular/TypeScript Compilation Errors:
#    - Check syntax errors in .ts files and Angular components
#    - Verify import statements and Angular module dependencies
#    - Ensure Angular 19.1.0 compatibility with dependencies
#    - Review tsconfig.json and angular.json configurations
#
# 2. pnpm/Dependency Issues:
#    - Check pnpm-lock.yaml exists and is not corrupted
#    - Verify package.json dependencies are compatible
#    - Review Angular Material and FontAwesome version conflicts
#    - Ensure Node.js version compatibility (20+)
#
# 3. ESLint/Code Quality Failures:
#    - Review eslint.config.js configuration
#    - Check for Angular-specific linting rule violations
#    - Verify component lifecycle methods are properly implemented
#    - Ensure proper TypeScript typing in services and components
#
# 4. Docker Build Failures:
#    - Ensure artifacts/browser directory exists after Angular build
#    - Review Dockerfile nginx configuration
#    - Check base nginx:alpine image availability
#    - Verify Angular build output matches Docker COPY paths
#
# 5. Container Environment Issues:
#    - Verify docker-build-agent container availability
#    - Check container registry access permissions
#    - Review node-in-docker-build script execution
#    - Monitor container resource limits and build timeouts
#
# 6. Path Filter Issues:
#    - Review paths-ignore configuration for documentation/**
#    - Check if changes affect ignored paths only (.github/**)
#    - Verify branch and path conditions match project structure
#
#
# ====================================================================
# PERFORMANCE OPTIMIZATION
# ====================================================================
#
# This workflow is optimized for:
# - Fast Angular builds using dry-run validation
# - Resource efficiency (no artifact publishing to registries)
# - Parallel execution capability within build steps
# - Minimal resource consumption for PR validation
#
# Performance Monitoring:
# - Typical run time: 3-5 minutes (Angular builds + Docker validation)
# - Resource usage: Medium (Angular compilation, Docker build)
# - Success rate: Monitor for build failures across branches
# - Queue time: Monitor GitHub runner availability
#
# Angular-Specific Optimizations:
# - Production build configuration for validation
# - pnpm dependency caching within container
# - Docker layer caching for base nginx image
# - Parallel TypeScript compilation where possible
#
# ====================================================================
# MAINTENANCE & MONITORING
# ====================================================================
#
# Regular Maintenance Tasks:
# - Update GitHub Actions versions (actions/checkout@v4)
# - Monitor docker-build-agent container updates
# - Review and optimize Angular build configuration
# - Update path exclusion patterns as project structure evolves
# - Review success/failure rates and optimize build times
#
# Monitoring Points:
# - Build success rate per branch/PR for Angular builds
# - Average build duration trends (target: <5 minutes)
# - Error patterns in TypeScript compilation and Angular builds
# - Resource usage and efficiency metrics
# - Developer feedback on CI speed and Angular-specific error reporting
#
# Angular Project Maintenance:
# - Monitor Angular CLI and dependency updates
# - Review ESLint configuration for new Angular features
# - Validate Docker nginx configuration for Angular routing
# - Check Angular Material and third-party library compatibility
#
# ====================================================================