
# ====================================================================
# RELEASE WORKFLOW
# ====================================================================
# 
# Purpose: Automated production deployment workflow that builds and publishes
#          Docker images to GitHub Container Registry and creates GitHub releases
#          when code is pushed to the main branch.
#
# This workflow is responsible for:
# - Building production-ready Docker images
# - Publishing images to GitHub Container Registry (ghcr.io)
# - Creating versioned GitHub releases with automated release notes
# - Sending deployment notifications via configured webhooks
#
# ====================================================================
# TRIGGERS
# ====================================================================
#
# This workflow runs on:
# 1. PUSH TO MAIN BRANCH: Automatic deployment when code is merged to main
# 2. MANUAL TRIGGER: Emergency releases or testing via workflow_dispatch
#
# Path Exclusions (workflow will NOT run if only these paths change):
# - documentation/** : Documentation-only changes don't require deployment
# - .github/**       : Workflow configuration changes don't require deployment
#
# ====================================================================
# WORKFLOW ARCHITECTURE
# ====================================================================
#
# Runner Environment:
# - OS: Ubuntu Latest (GitHub-hosted)
# - Container: Custom build agent (ghcr.io/the-running-dev/build-agent:latest)
# - Runtime: Node.js with Docker-in-Docker capabilities
#
# Build Process:
# 1. Full repository checkout with complete git history
# 2. Version calculation using GitVersion for semantic versioning
# 3. Production Docker image build and optimization
# 4. Image publishing to GitHub Container Registry
# 5. GitHub release creation with auto-generated release notes
# 6. Notification delivery via configured webhooks
#
# ====================================================================
# PERMISSIONS & SECURITY
# ====================================================================
#
# Required Permissions:
# - packages:write : Publish Docker images to GitHub Container Registry
# - contents:write : Create GitHub releases and tags
#
# Required Secrets:
# - REGISTRY_TOKEN            : GitHub token with package write permissions
# - NOTIFICATIONS_WEBHOOK_URL : Webhook URL for build/deployment notifications
# - DISCORD_BOT_TOKEN         : Discord bot authentication token (runtime config)
# - DISCORD_WEBHOOK_URL       : Discord webhook for deployment notifications
#
# Security Features:
# - Minimal required permissions (principle of least privilege)
# - Secure secret management through GitHub Secrets
# - Container isolation for build process
# - Token scoping to specific operations
#
# ====================================================================
# VERSIONING STRATEGY
# ====================================================================
#
# Uses GitVersion for automatic semantic versioning:
# - MAJOR: Breaking changes (e.g., 1.0.0 -> 2.0.0)
# - MINOR: New features, backward compatible (e.g., 1.0.0 -> 1.1.0)
# - PATCH: Bug fixes and patches (e.g., 1.0.0 -> 1.0.1)
# - Automatic tag creation and release notes generation
#
# ====================================================================
# OUTPUTS & ARTIFACTS
# ====================================================================
#
# This workflow produces:
# - Docker Image: ghcr.io/the-running-dev/barstrad-bot:version
# - Registry Tags: 'latest' and semantic version tags
# - GitHub Release: Tagged release with automated release notes
# - Notifications: Webhook notifications for deployment status
#
# ====================================================================
name: Release

# ====================================================================
# WORKFLOW TRIGGERS
# ====================================================================
on:
  # Manual trigger for emergency releases or testing
  # Usage: Go to Actions tab > Release workflow > Run workflow
  workflow_dispatch:
  
  # Automatic trigger on main branch push (production deployment)
  push:
    branches:
      - main
    # Skip deployment if only documentation or workflow files changed
    paths-ignore:
      - 'documentation/**'  # Documentation updates don't require deployment
      - '.github/**'        # Workflow changes don't require deployment

# ====================================================================
# SECURITY PERMISSIONS
# ====================================================================
# Minimal required permissions following principle of least privilege
permissions:
  packages: write  # Required to publish Docker images to GitHub Container Registry
  contents: write  # Required to create GitHub releases and tags

# ====================================================================
# JOBS CONFIGURATION
# ====================================================================
jobs:
  Build:
    # Use GitHub-hosted Ubuntu runner for consistent environment
    runs-on: ubuntu-latest
    
    # Custom build container with pre-installed tools:
    # - Node.js runtime and npm/yarn
    # - Docker-in-Docker capabilities
    # - GitVersion for semantic versioning
    # - Custom build scripts (node-in-docker-build)
    container:
      image: ghcr.io/the-running-dev/build-agent:latest

    steps:
      # ================================================================
      # STEP 1: REPOSITORY CHECKOUT
      # ================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch complete git history for proper versioning
          # Required by GitVersion for accurate version calculation
          fetch-depth: 0

      # ================================================================
      # STEP 2: BUILD AND DEPLOYMENT
      # ================================================================
      - name: Build and Publish Image
        # Custom build script that performs:
        # 1. Version calculation using GitVersion
        # 2. Docker image build with production optimizations
        # 3. Image publishing to GitHub Container Registry
        # 4. GitHub release creation with auto-generated notes
        # 5. Notification dispatch via configured webhooks
        run: node-in-docker-build --create-github-release true
        env:
          # ============================================================
          # ENVIRONMENT VARIABLES & SECRETS
          # ============================================================
          
          # GitHub authentication token with package write permissions
          # Used for: Registry authentication, release creation, API access
          RegistryToken: ${{ secrets.REGISTRY_TOKEN }}
          
          # Webhook URL for build and deployment notifications
          # Used for: Sending status updates to external systems
          NotificationsWebHookUrl: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}

      - name: Check for Documentation Changes
        id: docs-changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^documentation/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Docs Build
        if: steps.docs-changed.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: Update-Documentation

# ====================================================================
# TROUBLESHOOTING GUIDE
# ====================================================================
#
# Common Issues and Solutions:
#
# 1. Build Failures:
#    - Check container availability: ghcr.io/the-running-dev/build-agent:latest
#    - Verify TypeScript compilation in source code
#    - Review Docker build logs for specific errors
#
# 2. Registry Push Failures:
#    - Ensure REGISTRY_TOKEN has 'packages:write' permission
#    - Verify token is not expired
#    - Check registry storage limits
#
# 3. Release Creation Failures:
#    - Ensure REGISTRY_TOKEN has 'contents:write' permission
#    - Check if version tag already exists
#    - Verify GitVersion.yml configuration
#
# 4. Version Conflicts:
#    - Review GitVersion configuration in GitVersion.yml
#    - Check if manual tags conflict with automatic versioning
#    - Ensure main branch has proper commit history
#
# 5. Notification Failures:
#    - Verify webhook URLs are accessible
#    - Check webhook endpoint authentication
#    - Review webhook payload format requirements
#
# ====================================================================
# MONITORING & MAINTENANCE
# ====================================================================
#
# Regular Maintenance Tasks:
# - Update GitHub Actions versions (actions/checkout@v4)
# - Rotate authentication tokens (REGISTRY_TOKEN)
# - Monitor build container updates
# - Review and update webhook configurations
# - Monitor registry storage usage
#
# Monitoring Points:
# - GitHub Actions workflow run status
# - GitHub Container Registry image sizes and count
# - GitHub Releases creation success rate
# - Webhook notification delivery success
# - Build duration and resource usage trends
#
# ====================================================================