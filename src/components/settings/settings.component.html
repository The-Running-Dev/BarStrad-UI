<!-- src/app/settings/settings.component.html -->

<div class="settings">
  <h2>Settings</h2>
  <form [formGroup]="settingsForm" (ngSubmit)="savePreferences()">
    <div>
      <label for="theme">Theme:</label>
      <select id="theme" formControlName="theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
      <div
        *ngIf="
          settingsForm.get('theme')?.invalid &&
          settingsForm.get('theme')?.touched
        "
      >
        <small class="error">Theme is required.</small>
      </div>
    </div>
    <div>
      <label for="language">Language:</label>
      <select id="language" formControlName="language">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <!-- Add more languages as needed -->
      </select>
      <div
        *ngIf="
          settingsForm.get('language')?.invalid &&
          settingsForm.get('language')?.touched
        "
      >
        <small class="error">Language is required.</small>
      </div>
    </div>
    <button type="submit" [disabled]="settingsForm.invalid">Save</button>
  </form>
</div>
